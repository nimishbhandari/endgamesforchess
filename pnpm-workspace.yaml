packages:
  - apps/*
  - packages/*
  - tools/*
  - services/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  chess.js: ^1.4.0
  react-chessboard: ^5.10.0
  stockfish: ^18.0.8
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
# stockfish's postinstall only symlinks its "full" build's generic filename — the exact
# lite-single files our own scripts/setup-engine.mjs copies ship pre-built in the package,
# so it's safe to skip. This must be explicit (not just a local warning) or a clean install
# under --frozen-lockfile (e.g. on Vercel) fails with ERR_PNPM_IGNORED_BUILDS.
# stockfish's postinstall only symlinks its "full" build's generic filename — the exact
# lite-single files our own scripts/setup-engine.mjs copies ship pre-built in the package,
# so it's safe to allow. This must be resolved explicitly here or a clean install under
# --frozen-lockfile (e.g. on Vercel) fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  stockfish: true
